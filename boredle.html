<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boredle</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#1a1a1b;
    --border:#d3d6da;
    --border-dark:#878a8c;
    --key-bg:#d3d6da;
    --key-text:#1a1a1b;
    --correct:#6aaa64;
    --present:#c9b458;
    --absent:#787c7f;
    --modal-bg:#ffffff;
    --header-border:#d3d6da;
  }
  html.dark{
    --bg:#121213;
    --text:#ffffff;
    --border:#3a3a3c;
    --border-dark:#565758;
    --key-bg:#818384;
    --key-text:#ffffff;
    --correct:#538d4e;
    --present:#b59f3b;
    --absent:#3a3a3c;
    --modal-bg:#121213;
    --header-border:#3a3a3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Helvetica Neue", Arial, "Clear Sans", sans-serif;
    transition:background .2s, color .2s;
  }
  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    max-width:500px;
    margin:0 auto;
  }
  header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    height:52px;
    border-bottom:1px solid var(--header-border);
    flex-shrink:0;
  }
  header h1{
    font-family:"nyt-karnakcondensed","Helvetica Neue",Arial,sans-serif;
    font-size:36px;
    font-weight:700;
    letter-spacing:0.06em;
    margin:0 auto;
    text-transform:uppercase;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px;
  }
  .icon-btn svg{width:24px;height:24px;fill:none;stroke:var(--text);stroke-width:2;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:8px 8px 0;
    overflow:hidden;
  }

  #board-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:0;
  }
  #board{
    display:grid;
    grid-template-rows:repeat(var(--max-rows,6), 1fr);
    gap:5px;
    width:min(calc(var(--word-len,5) * 66px), 92vw);
    height:min(calc(var(--max-rows,6) * 62px), 68vh);
  }
  .row{
    display:grid;
    grid-template-columns:repeat(var(--word-len,5), 1fr);
    gap:5px;
  }
  .tile{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(0.9rem, calc(2.6rem - (var(--word-len,5) - 4) * 0.28rem), 2rem);
    font-weight:bold;
    line-height:1.1;
    border:2px solid var(--border);
    text-transform:uppercase;
    color:var(--text);
    user-select:none;
  }
  .tile.filled{
    border-color:var(--border-dark);
    animation:pop 0.1s ease-in-out;
  }
  @keyframes pop{
    0%{transform:scale(0.9);}
    40%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }
  .tile.flip{
    animation:flipTile 0.5s ease forwards;
  }
  @keyframes flipTile{
    0%{transform:rotateX(0deg);}
    50%{transform:rotateX(90deg);}
    100%{transform:rotateX(0deg);}
  }
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .tile.present{background:var(--present);border-color:var(--present);color:#fff;}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#fff;}
  .row.shake{animation:shake 0.5s;}
  @keyframes shake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }
  .tile.bounce{animation:bounce 0.6s;}
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    20%{transform:translateY(0);}
    40%{transform:translateY(-18px);}
    60%{transform:translateY(0);}
  }

  #toast-wrap{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    pointer-events:none;
  }
  .toast{
    background:var(--text);
    color:var(--bg);
    padding:10px 16px;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }

  #keyboard{
    width:100%;
    max-width:500px;
    margin:0 auto;
    padding:8px 8px 12px;
    user-select:none;
    flex-shrink:0;
  }
  .krow{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:8px;
  }
  .key{
    flex:1;
    max-width:43px;
    height:58px;
    border:0;
    border-radius:4px;
    background:var(--key-bg);
    color:var(--key-text);
    font-weight:bold;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    text-transform:uppercase;
    transition:background .1s;
  }
  .key.wide{max-width:65px;font-size:11px;}
  .key.correct{background:var(--correct);color:#fff;}
  .key.present{background:var(--present);color:#fff;}
  .key.absent{background:var(--absent);color:#fff;}
  .key:active{opacity:0.7;}
  .key svg{width:22px;height:22px;fill:var(--key-text);}

  #overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:300;
    padding-top:8vh;
  }
  #overlay.show{display:flex;}
  .modal{
    background:var(--modal-bg);
    color:var(--text);
    border-radius:8px;
    padding:20px 24px 24px;
    max-width:340px;
    width:88%;
    position:relative;
    box-shadow:0 4px 23px rgba(0,0,0,0.3);
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-close{
    position:absolute;
    top:12px;right:12px;
    background:none;border:none;
    cursor:pointer;
    color:var(--text);
  }
  .modal h2{
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:18px;
    margin:4px 0 16px;
  }
  .modal p{font-size:14px;line-height:1.5;}
  .example-row{display:flex;gap:4px;margin:8px 0;}
  .example-tile{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:18px;
    border:2px solid var(--border);
    text-transform:uppercase;
  }
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

  .stats-grid{
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin:16px 0;
  }
  .stats-grid div{display:flex;flex-direction:column;}
  .stats-num{font-size:28px;font-weight:400;}
  .stats-label{font-size:10px;max-width:70px;}
  .dist-row{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0;}
  .dist-num{width:10px;}
  .dist-bar-wrap{flex:1;background:transparent;}
  .dist-bar{
    background:var(--absent);
    color:#fff;
    text-align:right;
    padding:2px 6px;
    min-width:20px;
    font-weight:600;
    font-size:13px;
  }
  .dist-bar.highlight{background:var(--correct);}

  .modal-actions{
    display:flex;
    justify-content:center;
    margin-top:18px;
  }
  .share-btn{
    background:var(--correct);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:4px;
    font-weight:bold;
    font-size:14px;
    letter-spacing:0.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .toggle-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .switch{
    position:relative;width:40px;height:22px;
    background:var(--absent);
    border-radius:12px;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch.on{background:var(--correct);}
  .switch::after{
    content:"";
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;
    background:#fff;border-radius:50%;
    transition:left .15s;
  }
  .switch.on::after{left:20px;}
</style>
</head>

      </button>
    </div>
  </header>

  <div id="puzzleBar" style="text-align:center;font-size:12px;font-weight:600;letter-spacing:0.5px;color:var(--border-dark);padding:6px 0 0;"></div>

  <div id="toast-wrap"></div>

  <main>
    <div id="board-wrap"><div id="board"></div></div>
    <div id="keyboard">
      <div class="krow" data-row="0"></div>
      <div class="krow" data-row="1"></div>
      <div class="krow" data-row="2"></div>
    </div>
  </main>
</div>

<div id="overlay">

      if(i===2){

      }
      rowStr.split('').forEach(function(ch){
        var k=makeKey(ch,false);

      });

  function makeKey(label,wide){

  function useHint(){

  function evaluateGuess(guess,ans){

    for(var i=0;i<WORD_LEN;i++){
      if(result[i]==='correct') continue;
      var found=-1;
      for(var j=0;j<WORD_LEN;j++){
        if(!used[j]&&ansArr[j]===guessArr[i]){ found=j; break; }

      if(found>=0){ result[i]='present'; used[found]=true; }

    var lastNonZero=-1;
    for(var di=0;di<distArr.length;di++){ if(distArr[di]>0) lastNonZero=di; }
    var rowsToShow = Math.max(MAX_ROWS, lastNonZero+1, 6);
    var maxDist = Math.max.apply(null, distArr.slice(0,rowsToShow).concat([1]));
    var distHtml = '';
    for(var ri=0;ri<rowsToShow;ri++){
      var count = distArr[ri]||0;
      var isCurrent = gameOver && guesses.length===ri+1 && guesses[guesses.length-1]===answer;
      var width = Math.max(7, Math.round((count/maxDist)*100));
      distHtml += '<div class="dist-row"><div class="dist-num">'+(ri+1)+'</div>'+
        '<div class="dist-bar-wrap"><div class="dist-bar'+(isCurrent?' highlight':'')+'" style="width:'+width+'%">'+count+'</div></div></div>';
    }

    var resultBanner = '';
    if(gameOver){
      var won = guesses.length>0 && guesses[guesses.length-1]===answer;
      resultBanner = '<p style="text-align:center;font-weight:600;margin-bottom:4px;">'+
        (won ? 'You got it!' : ('The word was: '+answer)) + '</p>'+
        '<p style="text-align:center;font-size:12px;color:var(--border-dark);margin-top:0;">'+
        'Puzzle '+(puzzleSlot+1)+' complete — keep going whenever you want.'+
        '</p>';
    }

    var actionsHtml = '';
    if(gameOver){
      actionsHtml = '<div class="modal-actions" style="gap:10px;">'+
        '<button class="share-btn" id="nextPuzzleBtn" style="background:var(--text);">Next Puzzle ▶</button>'+
        '<button class="share-btn" id="shareBtn">Share'+
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>'+
        '</button></div>';
    }

    modalContent.innerHTML =
      '<button class="modal-close" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'+
      '<h2>Statistics</h2>'+
      resultBanner+
      '<div class="stats-grid">'+
        '<div><div class="stats-num">'+(stats.played||0)+'</div><div class="stats-label">Played</div></div>'+
        '<div><div class="stats-num">'+winPct+'</div><div class="stats-label">Win %</div></div>'+
        '<div><div class="stats-num">'+(stats.streak||0)+'</div><div class="stats-label">Current Streak</div></div>'+
        '<div><div class="stats-num">'+(stats.maxStreak||0)+'</div><div class="stats-label">Max Streak</div></div>'+
      '</div>'+
      '<h2 style="font-size:14px;text-transform:none;letter-spacing:0;text-align:left;margin-bottom:8px;">Guess Distribution</h2>'+
      distHtml+
      actionsHtml;

    overlay.classList.add('show');

    if(gameOver){
      var shareBtn=document.getElementById('shareBtn');
      if(shareBtn){
        shareBtn.addEventListener('click', function(){
          var text=buildShareGrid();
          copyText(text);
          shareBtn.innerHTML='Copied to clipboard!';
        });
      }
      var nextBtn=document.getElementById('nextPuzzleBtn');
      if(nextBtn){
        nextBtn.addEventListener('click', function(){
          closeModal();
          startSlot(puzzleSlot+1);
          buildBoard();
          buildKeyboard();
          updatePuzzleBar();
          updateHintBtn();
          saveState();
        });
      }
    }
  }
  function copyText(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  function showSettingsModal(){
    var isDark=document.documentElement.classList.contains('dark');
    modalContent.innerHTML =
      '<button class="modal-close" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'+
      '<h2>Settings</h2>'+
      '<div class="toggle-row"><span>Dark Theme</span><div class="switch'+(isDark?' on':'')+'" id="darkToggle"></div></div>';
    overlay.classList.add('show');
    document.getElementById('darkToggle').addEventListener('click', function(){
      document.documentElement.classList.toggle('dark');
      var nowDark=document.documentElement.classList.contains('dark');
      this.classList.toggle('on',nowDark);
      ls('set','wordle_theme', nowDark?'dark':'light');
    });
  }

  document.getElementById('helpBtn').addEventListener('click', showHelpModal);
  document.getElementById('hintBtn').addEventListener('click', useHint);
  document.getElementById('statsBtn').addEventListener('click', showStatsModal);
  document.getElementById('settingsBtn').addEventListener('click', showSettingsModal);

  document.addEventListener('keydown', function(e){
    if(overlay.classList.contains('show')){
      if(e.key==='Escape') closeModal();
      return;
    }
    if(e.key==='Enter') submitGuess();
    else if(e.key==='Backspace') backspace();
    else if(/^[a-zA-Z]$/.test(e.key)) typeLetter(e.key.toUpperCase());
  });

  // ---------- INIT ----------
  var savedTheme = ls('get','wordle_theme');
  if(savedTheme==='dark') document.documentElement.classList.add('dark');

  loadStats();

  var restored = loadState();
  if(!restored){ startSlot(0); }
  buildBoard();
  buildKeyboard();
  updateHintBtn();
  updatePuzzleBar();

  replayBoard();
  replayKeyboardColors();
  if(guesses.length===0 && !restored){ /* fresh day, nothing to replay */ }

  if(gameOver){
    setTimeout(function(){ showStatsModal(); }, 500);
  } else {
    // first-time visitors see help automatically
    if(!ls('get','wordle_visited')){
      showHelpModal();
      ls('set','wordle_visited','1');
    }
  }
})();
</script>
</body>
</html>
